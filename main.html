<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090914">

<title>Along Digital | Beyond Learning</title>
<meta name="description" content="Along Digital - Discover educational platforms, online learning, tests, study resources and digital technology.">

<link rel="stylesheet" href="style.css">
</head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap');

:root {
  --bg: #090914;
  --surface: #111120;
  --surface2: #17172a;
  --border: rgba(255,255,255,.09);
  --text: #f5f4ff;
  --muted: #9292aa;
  --purple: #9b72ff;
  --cyan: #55e5ed;
  --pink: #e879f9;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  overflow-x: hidden;
}

a {
  text-decoration: none;
  color: inherit;
}
.ad-navbar {
  width: 100%;
  position: sticky;
  top: 0;
  z-index: 9999;
  background: rgba(12, 10, 30, 0.94);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
  font-family: inherit;
}

.ad-nav-container {
  max-width: 1250px;
  min-height: 76px;
  margin: auto;
  padding: 0 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.ad-brand {
  display: flex;
  align-items: center;
  gap: 11px;
  color: #fff;
  text-decoration: none;
  font-size: 21px;
  font-weight: 800;
  white-space: nowrap;
}

.ad-brand-icon {
  width: 40px;
  height: 40px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  color: #fff;
  background: linear-gradient(135deg, #7c3aed, #06b6d4);
  font-size: 14px;
}

.ad-nav-links {
  display: flex;
  align-items: center;
  gap: 8px;
}

.ad-nav-link,
.ad-drop-btn {
  padding: 12px 13px;
  border: 0;
  border-radius: 9px;
  color: #cbd5e1;
  background: transparent;
  text-decoration: none;
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.25s;
}

.ad-nav-link:hover,
.ad-drop-btn:hover,
.ad-nav-link.active {
  color: #22d3ee;
  background: rgba(34,211,238,0.09);
}

.ad-dropdown {
  position: relative;
}

.ad-drop-btn span {
  display: inline-block;
  margin-left: 4px;
  transition: transform 0.25s;
}

.ad-dropdown.open .ad-drop-btn span {
  transform: rotate(180deg);
}

.ad-dropdown-menu {
  position: absolute;
  top: calc(100% + 12px);
  left: 0;
  min-width: 225px;
  padding: 9px;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 13px;
  background: #17142f;
  box-shadow: 0 15px 35px rgba(0,0,0,0.35);
  opacity: 0;
  visibility: hidden;
  transform: translateY(10px);
  transition: 0.22s;
}

.ad-dropdown:hover .ad-dropdown-menu,
.ad-dropdown:focus-within .ad-dropdown-menu,
.ad-dropdown.open .ad-dropdown-menu {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.ad-dropdown-menu a {
  display: block;
  padding: 11px 12px;
  border-radius: 8px;
  color: #cbd5e1;
  text-decoration: none;
  font-size: 13px;
  transition: 0.2s;
}

.ad-dropdown-menu a:hover {
  color: #22d3ee;
  background: rgba(34,211,238,0.1);
}

.ad-login-btn {
  padding: 11px 20px;
  margin-left: 8px;
  border-radius: 9px;
  color: white;
  background: linear-gradient(120deg, #7c3aed, #0891b2);
  text-decoration: none;
  font-size: 14px;
  font-weight: 700;
  transition: 0.25s;
}

.ad-login-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 18px rgba(6,182,212,0.25);
}

/* MOBILE BUTTON */

.ad-menu-toggle {
  display: none;
  width: 42px;
  height: 42px;
  padding: 10px;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  background: transparent;
  cursor: pointer;
}

.ad-menu-toggle span {
  display: block;
  height: 2px;
  width: 100%;
  margin: 5px 0;
  border-radius: 5px;
  background: white;
  transition: 0.25s;
}

/* MOBILE NAVIGATION */

@media (max-width: 900px) {

  .ad-nav-container {
    min-height: 68px;
    padding: 0 16px;
  }

  .ad-menu-toggle {
    display: block;
  }

  .ad-nav-links {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 5px;
    max-height: calc(100vh - 70px);
    overflow-y: auto;
    padding: 15px 18px 22px;
    background: #100e25;
    border-bottom: 1px solid rgba(255,255,255,0.1);

    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(-10px);
    transition: 0.25s;
  }

  .ad-nav-links.active {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0);
  }

  .ad-nav-link,
  .ad-drop-btn {
    display: block;
    width: 100%;
    text-align: left;
    padding: 13px;
  }

  .ad-dropdown-menu {
    position: static;
    display: none;
    min-width: 100%;
    margin: 5px 0 8px;
    padding: 5px;
    background: rgba(255,255,255,0.04);
    border: 0;
    box-shadow: none;
    opacity: 1;
    visibility: visible;
    transform: none;
  }

  .ad-dropdown.open .ad-dropdown-menu {
    display: block;
  }

  .ad-login-btn {
    display: block;
    margin: 8px 0 0;
    text-align: center;
  }

  .ad-dropdown:hover .ad-dropdown-menu {
    display: none;
  }

  .ad-dropdown.open:hover .ad-dropdown-menu {
    display: block;
  }
}

/* SCROLL REVEAL */

.reveal-card,
.section-reveal {
    opacity: 0;
    transform: translateY(45px);
    transition:
        opacity .7s ease,
        transform .7s cubic-bezier(.2,.8,.2,1);
}

.reveal-card.is-visible,
.section-reveal.is-visible {
    opacity: 1;
    transform: translateY(0);
}

/* CARD HOVER */

.reveal-card.is-visible:hover {
    transform: translateY(-8px);
}

/* ACTIVE NAV LINK */

.nav-links a.nav-active {
    color: var(--cyan);
}

/* BACK TO TOP */

#backToTop {
    position: fixed;
    right: 22px;
    bottom: 25px;
    width: 46px;
    height: 46px;
    border: 1px solid rgba(155,114,255,.5);
    border-radius: 13px;
    background: #17172a;
    color: #55e5ed;
    font-size: 24px;
    cursor: pointer;
    opacity: 0;
    visibility: hidden;
    transform: translateY(15px);
    transition: .3s ease;
    z-index: 999;
}

#backToTop.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
}

#backToTop:hover {
    background: #9b72ff;
    color: white;
}

button, input {
  font: inherit;
}

.container {
  width: min(1160px, 90%);
  margin: auto;
}

/* NAVBAR */

header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(9,9,20,.86);
  backdrop-filter: blur(18px);
  border-bottom: 1px solid var(--border);
}

.navbar {
  height: 76px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.brand {
  display: flex;
  align-items: center;
  gap: 11px;
}

.brand-icon {
  width: 39px;
  height: 39px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: linear-gradient(135deg, #8b5cf6, #36d9e8);
  color: #080815;
  font-family: 'Space Grotesk';
  font-size: 23px;
  font-weight: 800;
}

.brand-name {
  font-family: 'Space Grotesk';
  font-weight: 700;
  font-size: 19px;
  letter-spacing: -.7px;
}

.brand-name span {
  color: var(--purple);
}

.nav-links {
  display: flex;
  gap: 31px;
  align-items: center;
}

.nav-links a {
  font-size: 13px;
  color: #c2c1d3;
  transition: .2s;
}

.nav-links a:hover {
  color: var(--cyan);
}

.nav-action {
  padding: 10px 19px;
  border: 1px solid rgba(155,114,255,.5);
  border-radius: 8px;
  color: #d9c9ff !important;
}

.menu-btn {
  display: none;
  background: none;
  border: 0;
  color: white;
  font-size: 25px;
  cursor: pointer;
}

/* HERO */

.hero {
  min-height: 590px;
  display: flex;
  align-items: center;
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 78% 35%, rgba(111,64,225,.20), transparent 38%),
    radial-gradient(ellipse at 15% 80%, rgba(32,173,194,.10), transparent 35%);
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: .17;
  background-image:
    linear-gradient(rgba(255,255,255,.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.05) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: linear-gradient(to bottom, black, transparent);
}

.hero-content {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: 1.15fr .85fr;
  align-items: center;
  gap: 35px;
  padding: 75px 0;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  color: var(--cyan);
  border: 1px solid rgba(85,229,237,.23);
  background: rgba(85,229,237,.06);
  padding: 8px 14px;
  border-radius: 30px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1.3px;
  margin-bottom: 25px;
}

.eyebrow-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--cyan);
  box-shadow: 0 0 12px var(--cyan);
}

.hero h1 {
  font-family: 'Space Grotesk';
  font-size: clamp(43px, 6vw, 72px);
  line-height: 1.08;
  letter-spacing: -3px;
  max-width: 650px;
}

.gradient-text {
  background: linear-gradient(90deg, #a78bfa, #55e5ed);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.hero-description {
  color: var(--muted);
  font-size: 15px;
  line-height: 1.9;
  max-width: 510px;
  margin-top: 23px;
}

.hero-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 13px;
  margin-top: 31px;
}

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 14px 22px;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 700;
  transition: .25s;
  cursor: pointer;
}

.btn-primary {
  color: #090914;
  background: linear-gradient(110deg, #b49aff, #69e7ed);
  box-shadow: 0 0 30px rgba(155,114,255,.17);
}

.btn-primary:hover {
  transform: translateY(-3px);
  box-shadow: 0 0 35px rgba(155,114,255,.35);
}

.btn-secondary {
  border: 1px solid var(--border);
  color: white;
  background: rgba(255,255,255,.035);
}

.btn-secondary:hover {
  border-color: var(--purple);
}
    .btn-classic {
      color: #0005;
      border: solid #256ceb;
      border-radius: 20px;
      background-color: linear-gradient(120deg,#910ceb,#bc1273f0);
      box-shadow: 0 8px 16px rgba(250,250,0.25);
      transition:  transform .2s,box-shadow .2s;
      }
    .btn-classic:hover{
      transform: translateY(-3px);
      }

/* HERO VISUAL */

.hero-visual {
  position: relative;
  min-height: 370px;
  display: grid;
  place-items: center;
}
  .menu-btn {
    cursor: pointer;
    transition: transform 0.3s ease;
}

.menu-btn:active {
    transform: scale(0.85);
}

.nav-links a {
    transition: color 0.3s ease,
                transform 0.3s ease;
}

.nav-links a:hover {
    transform: translateX(4px);
}

.orbit {
  width: 300px;
  height: 300px;
  position: absolute;
  border: 1px solid rgba(155,114,255,.18);
  border-radius: 50%;
  animation: rotate 28s linear infinite;
}

.orbit::before,
.orbit::after {
  content: "";
  position: absolute;
  border-radius: 50%;
  border: 1px solid rgba(85,229,237,.15);
}

.orbit::before {
  inset: 25px;
}

.orbit::after {
  inset: 55px;
}

@keyframes rotate {
  to { transform: rotate(360deg); }
}

.visual-card {
  position: relative;
  z-index: 2;
  width: min(340px, 100%);
  padding: 24px;
  border: 1px solid rgba(255,255,255,.14);
  border-radius: 19px;
  background: rgba(23,23,42,.85);
  backdrop-filter: blur(20px);
  box-shadow: 0 25px 80px #0008;
}

.visual-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}

.visual-label {
  font-size: 11px;
  color: var(--muted);
}

.live-status {
  color: var(--cyan);
  font-size: 10px;
}

.visual-card h3 {
  font-family: 'Space Grotesk';
  font-size: 23px;
  margin-bottom: 7px;
}

.visual-card > p {
  color: var(--muted);
  font-size: 12px;
}

.visual-items {
  margin-top: 22px;
  display: grid;
  gap: 11px;
}

.visual-item {
  padding: 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  display: flex;
  align-items: center;
  gap: 12px;
  background: rgba(255,255,255,.025);
}

.visual-icon {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  background: rgba(155,114,255,.17);
  color: #c8b5ff;
  font-weight: 800;
}

.visual-item strong {
  display: block;
  font-size: 12px;
}

.visual-item small {
  color: var(--muted);
  font-size: 10px;
}

/* STATS */

.stats {
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  background: rgba(255,255,255,.018);
}

.stats-inner {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  padding: 25px 0;
  text-align: center;
}

.stat-item {
  border-right: 1px solid var(--border);
}

.stat-item:last-child {
  border: 0;
}

.stat-item h3 {
  font-family: 'Space Grotesk';
  font-size: 23px;
  color: var(--cyan);
}

.stat-item p {
  font-size: 11px;
  color: var(--muted);
  margin-top: 3px;
}

/* SECTION */

.section {
  padding: 85px 0;
}

.section-header {
  text-align: center;
  margin-bottom: 35px;
}

.section-kicker {
  color: var(--purple);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  margin-bottom: 12px;
}

.section-header h2 {
  font-family: 'Space Grotesk';
  font-size: clamp(28px, 4vw, 40px);
  letter-spacing: -1.5px;
}

.section-header p {
  font-size: 13px;
  color: var(--muted);
  margin-top: 10px;
}

/* SEARCH */

.search-area {
  max-width: 540px;
  margin: 0 auto 23px;
  position: relative;
}

.search-area input {
  width: 100%;
  padding: 16px 19px 16px 47px;
  background: var(--surface);
  color: white;
  border: 1px solid var(--border);
  border-radius: 11px;
  outline: none;
  font-size: 13px;
}

.search-area input:focus {
  border-color: var(--purple);
}

.search-symbol {
  position: absolute;
  left: 17px;
  top: 13px;
  color: var(--muted);
  font-size: 18px;
}

/* FILTERS */

.filters {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 9px;
  margin-bottom: 34px;
}

.filter-btn {
  border: 1px solid var(--border);
  border-radius: 30px;
  padding: 9px 17px;
  color: #b6b4c9;
  background: transparent;
  font-size: 11px;
  cursor: pointer;
  transition: .2s;
}

.filter-btn:hover,
.filter-btn.active {
  color: white;
  border-color: var(--purple);
  background: rgba(155,114,255,.13);
}

/* PLATFORM CARDS */

.platform-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 17px;
}

.platform-card {
  position: relative;
  min-height: 235px;
  padding: 23px;
  overflow: hidden;
  border-radius: 14px;
  background: linear-gradient(145deg, #151527, #10101c);
  border: 1px solid var(--border);
  transition: .3s;
}

.platform-card::after {
  content: "";
  position: absolute;
  width: 130px;
  height: 130px;
  right: -75px;
  top: -75px;
  border-radius: 50%;
  background: var(--glow, rgba(155,114,255,.15));
  filter: blur(35px);
  transition: .3s;
}

.platform-card:hover {
  transform: translateY(-6px);
  border-color: rgba(155,114,255,.5);
  box-shadow: 0 15px 45px #0005;
}

.platform-card:hover::after {
  transform: scale(1.6);
}

.platform-icon {
  width: 47px;
  height: 47px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  font-family: 'Space Grotesk';
  font-size: 17px;
  font-weight: 800;
  margin-bottom: 19px;
  position: relative;
  z-index: 1;
}

.platform-card h3 {
  font-family: 'Space Grotesk';
  font-size: 17px;
  margin-bottom: 8px;
  position: relative;
  z-index: 1;
}

.platform-card p {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.8;
  position: relative;
  z-index: 1;
}

.platform-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 22px;
  position: relative;
  z-index: 1;
}

.platform-category {
  font-size: 10px;
  color: #b9a3ff;
  background: rgba(155,114,255,.12);
  border-radius: 20px;
  padding: 5px 10px;
}

.platform-link {
  color: var(--cyan);
  font-size: 11px;
  font-weight: 700;
}

.no-results {
  display: none;
  text-align: center;
  color: var(--muted);
  padding: 30px;
}

/* FEATURE BANNER */

.feature-banner {
  border: 1px solid rgba(155,114,255,.2);
  border-radius: 20px;
  padding: 45px;
  background:
    radial-gradient(circle at 85% 20%, rgba(155,114,255,.2), transparent 35%),
    linear-gradient(110deg, #151529, #111120);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 25px;
}

.feature-banner h2 {
  font-family: 'Space Grotesk';
  font-size: 29px;
}

.feature-banner p {
  font-size: 13px;
  color: var(--muted);
  margin-top: 10px;
  max-width: 530px;
}

/* ABOUT */

.about-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 50px;
  align-items: center;
}

.about-title {
  font-family: 'Space Grotesk';
  font-size: 37px;
  line-height: 1.2;
}

.about-text {
  color: var(--muted);
  font-size: 13px;
  line-height: 2;
  margin-top: 18px;
}

.about-boxes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 13px;
}

.about-box {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 23px;
  border-radius: 13px;
}

.about-box h3 {
  color: var(--cyan);
  font-size: 14px;
}

.about-box p {
  font-size: 11px;
  color: var(--muted);
  margin-top: 8px;
  line-height: 1.7;
}

/* FOOTER */

footer {
  background: #07070e;
  border-top: 1px solid var(--border);
  padding: 55px 0 22px;
}

.footer-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 40px;
}

.footer-brand p {
  max-width: 340px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.9;
  margin-top: 17px;
}

.footer-column h3 {
  font-size: 13px;
  margin-bottom: 17px;
}

.footer-column a {
  display: block;
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 12px;
}

.footer-column a:hover {
  color: var(--cyan);
}

.footer-bottom {
  border-top: 1px solid var(--border);
  margin-top: 40px;
  padding-top: 20px;
  text-align: center;
  font-size: 11px;
  color: var(--muted);
}

/* ANIMATIONS */

.reveal {
  animation: fadeUp .8s ease both;
}

@keyframes fadeUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* RESPONSIVE */

@media(max-width: 850px) {
  .hero-content {
    grid-template-columns: 1fr;
    text-align: center;
  }

  .hero-description {
    margin-left: auto;
    margin-right: auto;
  }

  .hero-buttons {
    justify-content: center;
  }

  .hero-visual {
    min-height: 340px;
  }

  .platform-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .about-grid {
    grid-template-columns: 1fr;
  }
}

@media(max-width: 600px) {
  .navbar {
    height: 68px;
  }

  .menu-btn {
    display: block;
  }

  .nav-links {
    display: none;
    position: absolute;
    top: 68px;
    left: 0;
    width: 100%;
    background: #111120;
    padding: 22px 5%;
    border-bottom: 1px solid var(--border);
    flex-direction: column;
    align-items: flex-start;
    gap: 20px;
  }

  .nav-links.active {
    display: flex;
  }

  .hero {
    min-height: auto;
  }

  .hero-content {
    padding: 75px 0 40px;
  }

  .hero h1 {
    letter-spacing: -2px;
  }

  .hero-description {
    font-size: 13px;
  }

  .hero-visual {
    min-height: 330px;
  }

  .orbit {
    width: 260px;
    height: 260px;
  }

  .visual-card {
    width: 290px;
  }

  .stats-inner {
    gap: 10px;
  }

  .stat-item h3 {
    font-size: 18px;
  }

  .stat-item p {
    font-size: 9px;
  }

  .section {
    padding: 65px 0;
  }

  .platform-grid {
    grid-template-columns: 1fr;
  }

  .feature-banner {
    padding: 27px;
    align-items: flex-start;
    flex-direction: column;
  }

  .feature-banner h2 {
    font-size: 24px;
  }

  .about-title {
    font-size: 30px;
  }

  .footer-grid {
    grid-template-columns: 1fr 1fr;
  }

  .footer-brand {
    grid-column: 1 / -1;
  }
}
