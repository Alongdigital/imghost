
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mr. Bot | Along Digital</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #080d18;
  color: #e8eefc;
  font-family: Arial, sans-serif;
  height: 100vh;
  display: flex;
  overflow: hidden;
}

/* Sidebar */
.sidebar {
  width: 260px;
  background: #0d1525;
  border-right: 1px solid #202d43;
  padding: 20px;
  display: flex;
  flex-direction: column;
}

.logo {
  font-size: 23px;
  font-weight: bold;
  color: #4d9aff;
  margin-bottom: 25px;
}

.new-chat {
  background: #1c3151;
  color: white;
  border: 1px solid #31527c;
  padding: 13px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 14px;
}

.history-title {
  margin: 25px 0 12px;
  color: #8192ae;
  font-size: 12px;
  text-transform: uppercase;
}

.history-list {
  overflow-y: auto;
}

.history-item {
  padding: 12px;
  border-radius: 8px;
  color: #b8c5db;
  font-size: 13px;
  cursor: pointer;
  margin-bottom: 5px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.history-item:hover {
  background: #192944;
}

/* Main */
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.header {
  height: 65px;
  border-bottom: 1px solid #202d43;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
}

.header h2 {
  font-size: 17px;
}

.status {
  color: #45d99b;
  font-size: 12px;
}

/* Chat */
.chat {
  flex: 1;
  overflow-y: auto;
  padding: 25px 5%;
  scroll-behavior: smooth;
}

.welcome {
  text-align: center;
  margin: 12vh auto 30px;
  max-width: 500px;
}

.bot-icon {
  width: 75px;
  height: 75px;
  border-radius: 23px;
  background: linear-gradient(135deg,#1764bd,#399aff);
  display: grid;
  place-items: center;
  font-size: 35px;
  margin: auto auto 20px;
}

.welcome h1 {
  font-size: 30px;
  margin-bottom: 12px;
}

.welcome p {
  color: #91a1bc;
  line-height: 1.6;
}

.message {
  display: flex;
  gap: 12px;
  margin: 22px auto;
  max-width: 850px;
}

.avatar {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border-radius: 11px;
  background: #1b3d68;
  display: grid;
  place-items: center;
}

.message-content {
  flex: 1;
  min-width: 0;
  line-height: 1.7;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.message.user .avatar {
  background: #314052;
}

.copy-btn {
  display: block;
  margin-top: 10px;
  background: #1a2b44;
  color: #9ec8ff;
  border: none;
  padding: 7px 12px;
  border-radius: 6px;
  cursor: pointer;
}

/* Input */
.input-area {
  padding: 15px 5% 20px;
}

.input-box {
  max-width: 850px;
  margin: auto;
  background: #121e31;
  border: 1px solid #2a4264;
  border-radius: 16px;
  padding: 12px;
  display: flex;
  align-items: flex-end;
  gap: 10px;
}

.input-box textarea {
  flex: 1;
  resize: none;
  max-height: 140px;
  background: transparent;
  border: none;
  outline: none;
  color: white;
  font-size: 15px;
  padding: 8px;
  font-family: inherit;
}

.send-btn {
  background: #3285ff;
  border: none;
  color: white;
  width: 42px;
  height: 42px;
  border-radius: 11px;
  cursor: pointer;
  font-size: 20px;
}

.send-btn:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.footer {
  text-align: center;
  color: #687b99;
  font-size: 11px;
  margin-top: 10px;
}

@media(max-width:650px) {
  .sidebar {
    display: none;
  }

  .chat {
    padding: 18px;
  }

  .input-area {
    padding: 10px 12px 15px;
  }

  .welcome {
    margin-top: 15vh;
  }
}
</style>
</head>

<body>

<aside class="sidebar">
  <div class="logo">✦ Mr. Bot</div>

  <button class="new-chat" onclick="newChat()">
    + New Chat
  </button>

  <div class="history-title">Recent Chats</div>
  <div class="history-list" id="historyList"></div>
</aside>

<main class="main">

  <header class="header">
    <h2>Mr. Bot</h2>
    <span class="status">● AI Assistant</span>
  </header>

  <section class="chat" id="chat">

    <div class="welcome" id="welcome">
      <div class="bot-icon">🤖</div>
      <h1>Welcome to Mr. Bot</h1>
      <p>Your intelligent digital assistant.<br>
      Ask anything and let's explore together.</p>
    </div>

  </section>

  <section class="input-area">

    <div class="input-box">
      <textarea
        id="userInput"
        rows="1"
        placeholder="Message Mr. Bot..."
      ></textarea>

      <button class="send-btn" id="sendBtn"
        onclick="sendMessage()">↑</button>
    </div>

    <div class="footer">
      Mr. Bot can make mistakes. Verify important information.
    </div>

  </section>

</main>

<script>

// =================================
// MR. BOT CONFIGURATION
// =================================

const CONFIG = {
  apiKey: "AQ.Ab8RN6JdUeCQ7-Ci63N8j2hP0TLmPGyk1jVnFfFMZDfKKTHC9w",
  model: "gpt-4.1-mini",
  apiURL: "https://api.openai.com/v1/responses"
};

const SYSTEM_INSTRUCTIONS =
  "You are Mr. Bot, an intelligent and helpful AI assistant created by Along Digital. Respond clearly and helpfully. You can communicate in Hindi, Hinglish and English.";


// =================================
// CHAT DATA
// =================================

let chats = JSON.parse(
  localStorage.getItem("mrbot_chats") || "[]"
);

let currentChat = null;
let isLoading = false;

const chatBox = document.getElementById("chat");
const input = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");


// =================================
// SAVE DATA
// =================================

function saveChats() {
  localStorage.setItem(
    "mrbot_chats",
    JSON.stringify(chats)
  );
  renderHistory();
}


// =================================
// NEW CHAT
// =================================

function newChat() {
  currentChat = null;
  chatBox.innerHTML = `
    <div class="welcome" id="welcome">
      <div class="bot-icon">🤖</div>
      <h1>Welcome to Mr. Bot</h1>
      <p>Your intelligent digital assistant.<br>
      Ask anything and let's explore together.</p>
    </div>
  `;
}


// =================================
// RENDER HISTORY
// =================================

function renderHistory() {
  const list = document.getElementById("historyList");

  list.innerHTML = "";

  chats.slice().reverse().forEach(c => {
    const item = document.createElement("div");
    item.className = "history-item";
    item.textContent = c.title || "New Chat";

    item.onclick = () => openChat(c.id);

    list.appendChild(item);
  });
}


// =================================
// OPEN CHAT
// =================================

function openChat(id) {
  const selected = chats.find(c => c.id === id);

  if (!selected) return;

  currentChat = selected.id;
  chatBox.innerHTML = "";

  selected.messages.forEach(m => {
    addMessage(m.role, m.content, false);
  });
}


// =================================
// ADD MESSAGE
// =================================

function addMessage(role, content, save = true) {

  document.getElementById("welcome")?.remove();

  const row = document.createElement("div");
  row.className = "message " + (role === "user" ? "user" : "bot");

  const avatar = document.createElement("div");
  avatar.className = "avatar";
  avatar.textContent = role === "user" ? "U" : "🤖";

  const body = document.createElement("div");
  body.className = "message-content";
  body.textContent = content;

  row.appendChild(avatar);
  row.appendChild(body);

  if (role === "assistant") {
    const copy = document.createElement("button");
    copy.className = "copy-btn";
    copy.textContent = "Copy";
    copy.onclick = () => {
      navigator.clipboard.writeText(content);
      copy.textContent = "Copied!";
      setTimeout(() => copy.textContent = "Copy", 1200);
    };
    body.appendChild(copy);
  }

  chatBox.appendChild(row);
  chatBox.scrollTop = chatBox.scrollHeight;
}


// =================================
// SEND MESSAGE
// =================================

async function sendMessage() {

  const text = input.value.trim();

  if (!text || isLoading) return;

  if (
    !CONFIG.apiKey ||
    CONFIG.apiKey === "PASTE_YOUR_OPENAI_API_KEY"
  ) {
    alert("Please add your OpenAI API key in CONFIG.");
    return;
  }

  if (!currentChat) {
    currentChat = Date.now();

    chats.push({
      id: currentChat,
      title: text.slice(0, 35),
      messages: []
    });
  }

  const active = chats.find(c => c.id === currentChat);

  active.messages.push({
    role: "user",
    content: text
  });

  addMessage("user", text);

  input.value = "";
  input.style.height = "auto";

  isLoading = true;
  sendBtn.disabled = true;

  const typing = document.createElement("div");
  typing.className = "message";
  typing.id = "typing";
  typing.textContent = "🤖 Mr. Bot is thinking...";
  chatBox.appendChild(typing);

  try {

    const response = await fetch(CONFIG.apiURL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + CONFIG.apiKey
      },

      body: JSON.stringify({

        model: CONFIG.model,

        instructions: SYSTEM_INSTRUCTIONS,

        input: active.messages.map(m => ({
          role: m.role === "assistant" ? "assistant" : "user",
          content: [
            {
              type: "input_text",
              text: m.content
            }
          ]
        })),

        max_output_tokens: 1000

      })

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.error?.message || "API request failed"
      );
    }

    const answer = data.output
      ?.flatMap(item => item.content || [])
      .filter(item => item.type === "output_text")
      .map(item => item.text)
      .join("\n") || "No response received.";

    active.messages.push({
      role: "assistant",
      content: answer
    });

    typing.remove();

    addMessage("assistant", answer);

    saveChats();

  } catch (error) {

    typing.remove();

    addMessage(
      "assistant",
      "Error: " + error.message
    );

  } finally {

    isLoading = false;
    sendBtn.disabled = false;
    input.focus();

  }

}


// =================================
// ENTER TO SEND
// =================================

input.addEventListener("keydown", e => {

  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }

});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height =
    Math.min(input.scrollHeight, 140) + "px";
});


// =================================
// INITIALIZE
// =================================

renderHistory();

</script>

</body>
</html>
