<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Password Wall</title>

<style>
body {
  margin: 0;
  background: #10131c;
  color: white;
  font-family: Arial;
  display: grid;
  place-items: center;
  min-height: 100vh;
}

.wall {
  background: #252b38;
  padding: 35px 25px;
  border-radius: 15px;
  text-align: center;
  width: 80%;
  max-width: 350px;
  border: 2px solid #596273;
}

input, button {
  padding: 13px;
  width: 90%;
  margin-top: 12px;
  border-radius: 8px;
  border: none;
}

button {
  background: #e8b83e;
  font-weight: bold;
  cursor: pointer;
}

#message {
  color: #ff7777;
}
</style>
</head>

<body>

<div class="wall">
  <h1>🔐 PASSWORD WALL</h1>
  <p>Enter password to cross the wall</p>

  <input type="password" id="pass"
  placeholder="Enter Password">

  <button onclick="unlock()">BYPASS WALL</button>

  <p id="message"></p>
</div>

<script>
function unlock() {
  const password = document.getElementById("pass").value;

  if (password === "1234") {
    document.getElementById("message").innerText =
      "Access Granted!";
    window.location.href = "success.html";
  } else {
    document.getElementById("message").innerText =
      "Wrong Password!";
  }
}
</script>

</body>
</html>
