
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Development</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #080b20, #111b3d, #090d25);
    color: white;
    overflow: hidden;
}





.bg-circle {
    position: absolute;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    filter: blur(100px);
    background: #5146ff;
    opacity: 0.35;
    animation: move 6s infinite alternate;
}

@keyframes move {
    from { transform: translate(-100px, -80px); }
    to { transform: translate(150px, 100px); }
}

.container {
    position: relative;
    width: 90%;
    max-width: 550px;
    padding: 50px 30px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 25px;
    background: rgba(255,255,255,0.07);
    backdrop-filter: blur(20px);
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
}

.icon {
    font-size: 65px;
    margin-bottom: 20px;
    animation: rotate 5s linear infinite;
}

@keyframes rotate {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}

.tag {
    display: inline-block;
    padding: 8px 18px;
    border-radius: 30px;
    background: rgba(99,102,241,0.2);
    border: 1px solid #7775ff;
    color: #aaaaff;
    font-size: 12px;
    letter-spacing: 2px;
    margin-bottom: 25px;
}

h1 {
    font-size: clamp(30px, 7vw, 43px);
    margin-bottom: 15px;
    background: linear-gradient(90deg, #fff, #999cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

p {
    color: #b8bfd6;
    font-size: 15px;
    line-height: 1.8;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    margin: 30px 0 10px;
    color: #c5c8ff;
    font-size: 13px;
}

.progress {
    width: 100%;
    height: 7px;
    background: #252b4c;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    width: 65%;
    height: 100%;
    border-radius: 20px;
    background: linear-gradient(90deg, #625bff, #a78bfa);
    box-shadow: 0 0 15px #7775ff;
    animation: load 2s ease;
}

@keyframes load {
    from { width: 0; }
    to { width: 65%; }
}

.footer {
    margin-top: 35px;
    font-size: 12px;
    color: #777f9e;
    letter-spacing: 1px;
}

.dot {
    display: inline-block;
    animation: blink 1.5s infinite;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.2; }
}

@media(max-width: 480px) {
    .container {
        padding: 40px 22px;
    }
}
</style>
</head>

<body>

<div class="bg-circle"></div>

<div class="container">

    <div class="icon">⚙️</div>

    <div class="tag">COMING SOON</div>

    <h1>This Website<br>Is Under Development</h1>

    <p>
        We're working hard to bring you something amazing.
        Our website is currently under development.
        Stay tuned for something special!
    </p>

    <div class="progress-info">
        <span>Development Progress</span>
        <span>65%</span>
    </div>

    <div class="progress">
        <div class="progress-bar"></div>
    </div>

    <div class="footer">
        © 2026 ALL RIGHTS RESERVED
        <br><br>
        <span class="dot">●</span> WORK IN PROGRESS
    </div>

</div>

</body>
</html>
